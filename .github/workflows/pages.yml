name: Testar e publicar Mestre Chalita
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mestre-chalita-pages
  cancel-in-progress: false
jobs:
  verify:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes
        run: node tests/smoke.cjs
  deploy:
    name: Publicar GitHub Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar site estático
        run: |
          mkdir -p public
          cp index.html public/index.html
          touch public/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar conteúdo
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
